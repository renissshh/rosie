[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rosie"
version = "0.3.0"
description = "Rosie (R.O.S.I.E.): a personal AI chief of staff for Windows, Telegram and Obsidian."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "renissshh" }]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tzdata>=2024.1",  # Windows has no system time-zone database for zoneinfo
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Microphone and speakers (Sprint 4). Not needed for chat, Telegram or tests.
voice = ["sounddevice>=0.4"]

[project.scripts]
rosie = "rosie.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rosie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
