[package]
name = "rosie-ui"
version = "0.4.0"
description = "Rosie's orb window"
authors = ["renissshh"]
license = "MIT"
edition = "2021"

[lib]
name = "rosie_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
