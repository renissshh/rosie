name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ui-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: Build the page (Tauri embeds it)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Rust tests
        working-directory: ui/src-tauri
        run: cargo test

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the always-on server image
        run: docker build -t rosie:ci .
      - name: Smoke test
        run: |
          docker run --rm rosie:ci rosie --version
          docker run --rm rosie:ci sh -c 'rosie server; test $? -eq 1'  # no Telegram token: explains, exits 1
          docker run --rm rosie:ci whoami | grep -qx rosie                # not root

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the installer twice (it must be safe to re-run)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "Rosie"
          ./scripts/install-windows.ps1 -DataDir $data -SkipDoctor
          ./scripts/install-windows.ps1 -DataDir $data -SkipDoctor
      - name: Check what it set up
        shell: pwsh
        run: |
          $config = [Environment]::GetEnvironmentVariable("ROSIE_CONFIG", "User")
          $core = [Environment]::GetEnvironmentVariable("ROSIE_CORE", "User")
          if (-not (Test-Path $config)) { throw "ROSIE_CONFIG not set" }
          & $core --version
          $data = (Join-Path $env:RUNNER_TEMP "Rosie") -replace '\\', '/'
          if (-not (Select-String -Path $config -SimpleMatch "data_dir: `"$data`"" -Quiet)) { throw "data_dir not written" }
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP "Rosie/rosie-vault/tasks"))) { throw "vault not created" }
