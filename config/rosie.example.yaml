# Copy to config/rosie.yaml and edit. Secrets go in .env, never here.

# Everything Rosie stores lives here (D: drive on Windows).
data_dir: "D:/Rosie"

# Rosie's own Obsidian vault. Default: D:/Rosie/rosie-vault
# vault_dir: "D:/Rosie/rosie-vault"

# Your own Obsidian vault. Rosie only READS it, never writes.
# user_vault_dir: "D:/Obsidian/MyVault"

timezone: "Asia/Kolkata"

# Primary brain: a free local model via Ollama (16 GB RAM is enough for 8B models).
llm:
  provider: ollama
  model: "qwen3:8b"
  base_url: "http://localhost:11434/v1"

# Optional fallback: any free-tier, OpenAI-compatible cloud API.
# fallback_llm:
#   provider: openai_compatible
#   model: "gemini-2.5-flash"
#   base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
#   api_key_env: "GEMINI_API_KEY"

max_agent_steps: 8

# Morning brief time (local). Written to rosie-vault/daily and sent as a notification.
brief_time: "07:30"

# Nightly review: 3 questions on Telegram (or a nudge to run `rosie review`).
review_time: "22:00"

# Rosie's voice (needs pip install -e ".[voice]"). List: `rosie voices`; try: `rosie say "hi" --voice kokoro-george`
voice: "kokoro-emma"

# Your usual day, drawn as the orb's Day Ring (a 24-hour clock, midnight at the top).
# kind: study, college, gym, review, sleep or other. During a "study" block the orb
# dims and only urgent reminders get through. `days` defaults to every day.
day_blocks:
  - { start: "09:00", end: "15:30", kind: college, label: "College", days: [mon, tue, wed, thu, fri] }
  - { start: "17:00", end: "18:00", kind: gym, label: "Gym" }
  - { start: "19:00", end: "21:00", kind: study, label: "Study" }
  - { start: "22:00", end: "22:15", kind: review, label: "Nightly review" }
  - { start: "23:30", end: "06:30", kind: sleep, label: "Sleep" }

# Dates to count down to on the Command Deck; the nearest one still ahead is shown.
countdowns:
  - { label: "Semester exams", date: "2027-05-10" }

# Your subjects, for the study coach ("how's my studying?"). A study-log line counts for
# a subject when it mentions it: "DBMS normal forms 45m" -> DBMS.
subjects: [DBMS, OS, Java, Maths]
